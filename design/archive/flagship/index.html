<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiviaLab — Flagship</title>
  <meta name="description" content="Run the MiviaLab flagship Next.js homepage prototype locally.">
  <style>
    :root {
      --bg: #F5F5F3;
      --text: #1A1A1A;
      --muted: #5C5C5C;
      --border: #DDD;
      --focus: #1E4D5C;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .wrap {
      width: min(100% - 2rem, 36rem);
      margin-inline: auto;
      padding-block: 3rem 4rem;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      margin: 0 0 0.5rem;
    }

    p {
      color: var(--muted);
      margin: 0 0 1rem;
    }

    pre {
      margin: 0 0 1.5rem;
      padding: 1rem 1.25rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    a {
      color: var(--focus);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
      font-size: 0.9375rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Flagship</h1>
    <p>This direction is a full Next.js app — not a static HTML file. Run it locally, then open the dev server in your browser.</p>

    <pre><code>cd design/flagship
npm install   # first time only
npm run dev</code></pre>

    <p>Then open <a href="http://localhost:3000">http://localhost:3000</a>.</p>

    <div class="actions">
      <a href="../index.html">← All explorations</a>
      <a href="README.md">README</a>
    </div>
  </div>
</body>
</html>
